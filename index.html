<!doctype html>
<html lang="ru">
<head>

<title>Школьный Помощник</title>
<style>
:root{--bg:#0e1020;--p:#171a2d;--p2:#1d2036;--t:#f6f5fb;--m:#9b9caf;--a:#8057e8;--a2:#a777ff;--ok:#43c58b;--bad:#ed6670;--b:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#8057e82b,transparent 38%),var(--bg);color:var(--t);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}#app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:82px}.top{height:76px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:#0e1020d9;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ad7cff,#6339c0);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 22px #8057e84d}.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--m);font-size:11px;margin-top:2px}.icon{border:0;background:none;font-size:23px;padding:8px}.screen{padding:8px 16px 24px}.head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 13px}.head h1{font-size:25px;margin:0}.head h2{font-size:18px;margin:0}.card{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 8px 25px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--m)}.small{font-size:12px}.link{border:0;background:none;color:var(--a2)}.primary{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,var(--a2),var(--a));font-weight:800}.secondary{border:1px solid var(--b);background:var(--p);border-radius:11px;padding:9px 12px}.empty{text-align:center;padding:34px 20px;color:var(--m)}.empty b{display:block;color:var(--t);margin-bottom:6px}.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:76px;background:#121426f2;backdrop-filter:blur(20px);border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:19px}.nav small{font-size:10px}.nav.on{color:var(--a2)}.schedule{overflow:hidden;padding:0}.scheduleHead{padding:15px;border-bottom:1px solid var(--b)}.scheduleList{display:grid;gap:6px;padding:9px}.lesson{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;background:#ffffff05;border-radius:13px;padding:10px}.num{width:29px;height:29px;border-radius:9px;background:#8057e82e;color:#c5aeff;display:grid;place-items:center;font-weight:800;font-size:12px}.lesson b{font-size:13px}.lesson small{display:block;color:var(--m);font-size:11px;margin-top:3px}.photo{border:1px dashed #ffffff2b;border-radius:17px;padding:20px;text-align:center}.photo input{display:none}.photo label{display:block}.photo .primary{margin-top:10px}.wrap{position:relative}.menu{position:absolute;right:0;top:42px;min-width:235px;background:#1a1c30;border:1px solid var(--b);border-radius:14px;padding:6px;z-index:45;box-shadow:0 18px 45px #0008}.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:11px}.menu button:hover{background:#ffffff0d}.danger{color:#ff8b92!important}.grades{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.grade{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-weight:800}.g5{background:#43c58b2e;color:#67dda9}.g4{background:#e8aa422b;color:#f0bd64}.g3{background:#e8aa421c;color:#e3a94f}.g2{background:#ed667026;color:#f47f87}.progress{height:6px;background:#ffffff0f;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#62dfaa)}.target{border:1px solid #8057e84d;background:#8057e812;color:#c8b7ff;border-radius:10px;padding:7px 9px}.goal{margin-top:11px;padding:11px;border-radius:12px;background:#8057e812;border:1px solid #8057e829;font-size:12px;line-height:1.45}.goal.ok{background:#43c58b12;border-color:#43c58b4d;color:#82dfb3}.item{display:flex;align-items:center;gap:11px}.subjectIcon{width:38px;height:38px;border-radius:12px;background:#8057e826;color:#ad8cff;display:grid;place-items:center}.itemMain{flex:1;min-width:0}.itemMain b{display:block;font-size:14px}.itemMain span{display:block;color:var(--m);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:24px;height:24px;border:1px solid #ffffff47;background:none;border-radius:8px}.check.done{background:var(--ok);border-color:var(--ok)}.check.done:after{content:'✓';font-weight:800}.form{display:grid;gap:12px}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#111427;color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;outline:0}.field textarea{min-height:95px;resize:vertical}.theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme button,.color{border:1px solid var(--b);background:var(--p);border-radius:11px;padding:10px}.theme .sel{border-color:var(--a)}.colors{display:flex;gap:10px}.color{width:32px;height:32px;padding:0;border-radius:50%}.color.sel{box-shadow:0 0 0 3px #fff3;border-color:#fff}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--b)}.setting:last-child{border-bottom:0}.setting b{font-size:14px}.setting span{display:block;color:var(--m);font-size:12px;margin-top:3px}.switch{width:48px;height:28px;border:0;border-radius:99px;background:#3a3c50;padding:3px}.switch i{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--ok)}.switch.on i{transform:translateX(20px)}.notice{padding:12px;border-radius:13px;background:#8057e812;border:1px solid #8057e833;color:#cbbcff;font-size:12px;line-height:1.45}.notice.bad{background:#ed667012;border-color:#ed667044;color:#ff9da4}.notice.ok{background:#43c58b12;border-color:#43c58b4d;color:#82dfb3}.modalBg{position:fixed;inset:0;z-index:60;background:#0009;backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);background:#16182b;border:1px solid var(--b);border-radius:25px 25px 0 0;padding:20px;max-height:88dvh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalHead h3{margin:0}.close{border:0;background:var(--p);border-radius:9px;width:34px;height:34px}@media(min-width:760px){.modalBg{align-items:center}.modal{border-radius:25px;max-width:620px}}
.authPage{min-height:100dvh;display:grid;place-items:center;padding:22px}.authCard{width:min(460px,100%);background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:24px;padding:22px;box-shadow:0 18px 60px #0005}.authLogo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#ad7cff,#6339c0);display:grid;place-items:center;font-size:27px;margin-bottom:14px}.authCard h1{margin:0 0 6px;font-size:25px}.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:18px 0}.authTabs button{border:1px solid var(--b);background:var(--p);border-radius:11px;padding:10px}.authTabs .sel{border-color:var(--a);background:#8057e812}.logout{color:#ff8b92}.badge{display:inline-flex;padding:5px 8px;border-radius:9px;background:#8057e81a;color:#cdbdff;font-size:11px}.adminBadge{background:#43c58b17;color:#80dfb0}.scheduleDay{padding:10px 12px 4px;color:#c9b9ff;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#ffffff05;border:1px solid var(--b);border-radius:13px;padding:12px}.stat b{display:block;font-size:18px}.stat span{color:var(--m);font-size:11px}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://igbkjkjagkhxpxezjwtj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_8PB2xWwyb4UXmfDElDVIJw_1CpEY4Sp';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const EDGE_URL=SUPABASE_URL+'/functions/v1/process-schedule';
const K='school-helper-v4';
const DEF={homework:[],grades:{},targets:{},settings:{theme:'dark',accent:'#8057e8',notifications:true,sound:true}};
const CLASSES=['5А','5Б','5В','5Г','6А','6Б','6В','6Г','7А','7Б','7В','7Г','8А','8Б','8В','8Г','9А','9Б','9В','9Г','10А','10Б','10В','10Г','11А','11Б','11В','11Г'];
let local=loadLocal(),route='home',profile=null,session=null,schedule=null;
function loadLocal(){try{return {...structuredClone(DEF),...(JSON.parse(localStorage.getItem(K))||{})}}catch{return structuredClone(DEF)}}
function saveLocal(){localStorage.setItem(K,JSON.stringify(local))}
function e(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function q(a){return Math.floor(a+.5)}
function sid(s){return btoa(unescape(encodeURIComponent(s))).replace(/\W/g,'').slice(0,22)||'x'}
function apply(){document.documentElement.style.setProperty('--a',local.settings.accent);let l=local.settings.theme==='light'||(local.settings.theme==='system'&&matchMedia('(prefers-color-scheme:light)').matches);let m=l?{'--bg':'#f4f3f8','--p':'#fff','--p2':'#faf9fd','--t':'#171625','--m':'#747381'}:{'--bg':'#0e1020','--p':'#171a2d','--p2':'#1d2036','--t':'#f6f5fb','--m':'#9b9caf'};Object.entries(m).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))}
function profileName(){return profile?.username||'Ученик'}
function isAdmin(){return profile?.role==='admin'}
function render(){apply();if(!session){document.getElementById('app').innerHTML=authPage();bindAuth();return}document.getElementById('app').innerHTML=appShell();bind();}
function authPage(){return `<div class="authPage"><div class="authCard"><div class="authLogo">▣</div><h1>Школьный Помощник</h1><p class="muted">Войди или создай аккаунт — расписание и класс сохранятся за тобой.</p><div class="authTabs"><button class="${authMode==='login'?'sel':''}" data-authmode="login">Войти</button><button class="${authMode==='signup'?'sel':''}" data-authmode="signup">Регистрация</button></div>${authMode==='signup'?`<div class="form"><div class="field"><label>Никнейм</label><input id="au" maxlength="30" placeholder="Например, Вася"></div><div class="field"><label>Класс</label><select id="ac">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Пароль</label><input id="ap" type="password" minlength="6" placeholder="Минимум 6 символов"></div><button class="primary" data-auth="signup">Создать аккаунт</button></div>`:`<div class="form"><div class="field"><label>Никнейм</label><input id="au" maxlength="30" placeholder="Твой ник"></div><div class="field"><label>Пароль</label><input id="ap" type="password" placeholder="Пароль"></div><button class="primary" data-auth="login">Войти</button><button class="link" data-auth="forgot">Сбросить пароль</button></div>`}<p id="authMsg" class="small muted" style="margin:12px 0 0"></p><p class="small muted" style="margin-top:18px">Пароль хранится в Supabase Auth. В приложении он не сохраняется.</p></div></div>`}
let authMode='login';
function bindAuth(){document.querySelectorAll('[data-authmode]').forEach(b=>b.onclick=()=>{authMode=b.dataset.authmode;render()});document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>authAction(b.dataset.auth))}
function technicalEmail(username){let bytes=new TextEncoder().encode(username.trim().toLowerCase());let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return 'u_'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+'@igbkjkjagkhxpxezjwtj.supabase.co'}
async function authAction(action){const msg=document.getElementById('authMsg');if(msg)msg.textContent='';if(action==='forgot'){return alert('Для сброса пароля в режиме «ник + пароль» понадобится админская процедура восстановления. Позже добавим её в админку.')}let username=document.getElementById('au')?.value.trim();let password=document.getElementById('ap')?.value||'';if(username.length<2)return setAuthMsg('Никнейм должен быть не короче 2 символов.');if(password.length<6)return setAuthMsg('Пароль должен быть не короче 6 символов.');const email=technicalEmail(username);
 if(action==='signup'){const className=document.getElementById('ac').value;setAuthMsg('Создаю аккаунт…');const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,class_name:className}}});if(error)return setAuthMsg(error.message);if(!data.session){return setAuthMsg('Аккаунт создан, но Supabase просит подтверждение email. В Supabase отключи Confirm email — после этого регистрация будет работать без почты.')}await bootUser(data.session)}
 if(action==='login'){setAuthMsg('Вхожу…');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return setAuthMsg('Не удалось войти: '+error.message);await bootUser(data.session)}}
function setAuthMsg(t){const x=document.getElementById('authMsg');if(x)x.textContent=t}
async function bootUser(s){session=s;const {data,error}=await sb.from('profiles').select('*').eq('id',s.user.id).single();if(error){await sb.auth.signOut();session=null;return setAuthMsg('Профиль не найден. Проверь trigger profiles в Supabase.')}profile=data;route='home';await loadSchedule();render()}
async function loadSchedule(){schedule=null;if(!profile)return;const {data}=await sb.from('schedules').select('class_name,lessons,updated_at').eq('class_name',profile.class_name).maybeSingle();if(data)schedule=data}
function appShell(){return `<header class="top"><button class="icon" id="hamb">☰</button><div class="brand"><div class="logo">▣</div><div><b>Школьный Помощник</b><small>${e(profileName())} · ${e(profile.class_name)}</small></div></div><button class="icon" id="accountTop">♙</button></header><main id="screen" class="screen">${({home,homework:hw,grades,settings,account,admin}[route]||home)()}</main><nav class="bottom"><button class="nav ${route==='home'?'on':''}" data-r="home">⌂<small>Главная</small></button><button class="nav ${route==='homework'?'on':''}" data-r="homework">▤<small>ДЗ</small></button><button class="nav ${route==='grades'?'on':''}" data-r="grades">▱<small>Оценки</small></button><button class="nav ${route==='settings'?'on':''}" data-r="settings">⚙<small>Настройки</small></button></nav>`}
function home(){return `<div class="head"><h1>Расписание</h1><div class="wrap"><button class="icon act" data-a="schedMenu">⋮</button><div class="menu" id="schedMenu" hidden>${isAdmin()?'<button data-r2="admin">🛡 Админ-панель</button>':''}<button data-a="account">👤 Аккаунт</button><button data-a="scheduleReload">↻ Обновить расписание</button></div></div></div>${schedule?.lessons?.length?scheduleCard():`<div class="card empty"><b>Расписания для ${e(profile.class_name)} пока нет</b>Администратор ещё не загрузил расписание для этого класса.<br><br>${isAdmin()?'<button class="primary" data-r2="admin">Загрузить расписание</button>':''}</div>`}<div class="head" style="margin-top:25px"><h2>Ближайшие задания</h2><button class="secondary" data-a="addHw">+</button></div>${local.homework.length?local.homework.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(hwItem).join(''):'<div class="card empty">Нет заданий. Нажми «+», чтобы добавить.</div>'}`}
function scheduleCard(){const groups={};for(const x of schedule.lessons||[]){const day=x.day||'Расписание';(groups[day]??=[]).push(x)}let html=`<div class="card schedule"><div class="scheduleHead"><div class="row"><div><b>${e(profile.class_name)}</b><div class="small muted">${schedule.updated_at?'Обновлено '+new Date(schedule.updated_at).toLocaleString('ru-RU'):''}</div></div><span class="badge">${schedule.lessons.length} уроков</span></div></div>`;for(const [day,arr] of Object.entries(groups)){html+=`<div class="scheduleDay">${e(day)}</div><div class="scheduleList">${arr.map((x,i)=>`<div class="lesson"><div class="num">${e(x.lesson||i+1)}</div><div><b>${e(x.subject||'Урок')}</b><small>${e([x.time,x.room?'каб. '+x.room:''].filter(Boolean).join(' · '))}</small></div></div>`).join('')}</div>`}return html+'</div>'}
function hwItem(x){return `<div class="card"><div class="item"><div class="subjectIcon">▤</div><div class="itemMain"><b>${e(x.subject)}</b><span>${e(x.text)} · до ${e(x.date)}</span></div><button class="check ${x.done?'done':''}" data-a="toggleHw" data-id="${x.id}"></button></div></div>`}
function hw(){return `<div class="head"><h1>Домашние задания</h1><button class="secondary" data-a="addHw">+</button></div>${local.homework.length?local.homework.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(hwItem).join(''):'<div class="card empty"><b>Пока пусто</b>Добавляй задания и отмечай выполненные.</div>'}`}
function grades(){const entries=Object.entries(local.grades);return `<div class="head"><h1>Оценки</h1><button class="secondary" data-a="addSubject">+</button></div>${entries.length?entries.map(([s,a])=>{let av=avg(a),t=local.targets[s]||4;return `<div class="card"><div class="row"><div><b>${e(s)}</b><div class="small muted">Средний: ${av?av.toFixed(2):'—'}</div></div><div class="wrap"><button class="icon" data-a="gm" data-s="${e(s)}">⋮</button><div class="menu" id="gm-${sid(s)}" hidden><button data-a="addGrade" data-s="${e(s)}">+ Оценка</button><button class="danger" data-a="delSubject" data-s="${e(s)}">Удалить предмет</button></div></div></div><div class="grades">${a.map(v=>`<span class="grade g${v}">${v}</span>`).join('')}</div><div class="row"><span class="small muted">Цель</span><select class="target" data-target="${e(s)}"><option value="4" ${t===4?'selected':''}>4</option><option value="5" ${t===5?'selected':''}>5</option></select></div><div class="progress"><i style="width:${Math.min(100,(av/5)*100)}%"></i></div></div>`}).join(''):'<div class="card empty"><b>Оценок пока нет</b>Нажми «+», чтобы добавить первый предмет.</div>'}`}
function settings(){return `<div class="head"><h1>Настройки</h1></div><div class="card"><h3>Внешний вид</h3><div class="theme">${[['light','☀ Светлая'],['dark','☾ Тёмная'],['system','◐ Авто']].map(x=>`<button class="${local.settings.theme===x[0]?'sel':''}" data-theme="${x[0]}">${x[1]}</button>`).join('')}</div><p class="small muted">Цвет акцента</p><div class="colors">${['#8057e8','#2878e5','#24ad80','#e8a32e','#e65d62'].map(c=>`<button class="color ${local.settings.accent===c?'sel':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div></div><div class="card"><h3>Система</h3>${setting('Уведомления','Напоминания о заданиях','notifications',local.settings.notifications)}${setting('Звуки','Звуки интерфейса','sound',local.settings.sound)}</div><div class="card"><div class="row"><div><b>Расписание</b><span class="small muted" style="display:block;margin-top:4px">Берётся из Supabase по твоему классу ${e(profile.class_name)}.</span></div><button class="secondary" data-a="scheduleReload">Обновить</button></div></div>`}
function account(){return `<div class="head"><h1>Аккаунт</h1></div><div class="card"><div class="row"><div><span class="small muted">Никнейм</span><h2 style="margin:5px 0 0">${e(profile.username)}</h2></div>${isAdmin()?'<span class="badge adminBadge">ADMIN</span>':''}</div><div class="form" style="margin-top:16px"><div class="field"><label>Никнейм</label><input id="an" maxlength="30" value="${e(profile.username)}"></div><div class="field"><label>Класс</label><select id="ac2">${CLASSES.map(c=>`<option ${c===profile.class_name?'selected':''}>${c}</option>`).join('')}</select></div><button class="primary" data-a="saveAccount">Сохранить профиль</button></div></div><div class="card"><h3>Пароль</h3><div class="form"><div class="field"><label>Новый пароль</label><input id="newpass" type="password" minlength="6" placeholder="Минимум 6 символов"></div><button class="secondary" data-a="changePassword">Изменить пароль</button></div></div><div class="card"><button class="secondary logout" style="width:100%" data-a="logout">Выйти из аккаунта</button></div>`}
function admin(){return `<div class="head"><h1>Админ-панель</h1><span class="badge adminBadge">ADMIN</span></div><div class="card"><h3>Общее расписание школы</h3><p class="muted small">Загрузи одну фотографию. Gemini 3.6 Flash распознает все классы, а приложение разложит результат по классам в Supabase.</p><div class="photo"><label for="adminPhoto"><b>📷 Выбрать фото расписания</b><br><span class="small muted">Лучше оригинальное фото без сильного наклона и бликов.</span><input id="adminPhoto" type="file" accept="image/*"><span class="primary">Выбрать фотографию</span></label></div><div id="adminResult" style="margin-top:12px"></div></div><div class="card"><h3>Состояние базы</h3><div id="adminStats" class="stats"><div class="stat"><b>…</b><span>классов</span></div><div class="stat"><b>…</b><span>последнее обновление</span></div></div></div><div class="card"><button class="secondary" style="width:100%" data-a="adminReload">Обновить список классов</button></div>`}
function setting(a,b,k,v){return `<div class="setting"><div><b>${a}</b><span>${b}</span></div><button class="switch ${v?'on':''}" data-toggle="${k}"><i></i></button></div>`}
function modal(html){const root=document.getElementById('modal');root.innerHTML=`<div class="modalBg" id="mb"><div class="modal">${html}</div></div>`;document.getElementById('mb').onclick=x=>{if(x.target.id==='mb')close()}}
function close(){document.getElementById('modal').innerHTML=''}
function openHw(){modal(`<div class="modalHead"><h3>Новое домашнее задание</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Предмет</label><input id="hs"></div><div class="field"><label>Задание</label><textarea id="ht"></textarea></div><div class="field"><label>Дата сдачи</label><input id="hd" type="date"></div><button class="primary" id="saveH">Добавить</button></div>`);document.getElementById('hd').value=new Date().toISOString().slice(0,10);document.getElementById('saveH').onclick=()=>{let s=document.getElementById('hs').value.trim(),t=document.getElementById('ht').value.trim(),d=document.getElementById('hd').value;if(!s||!t||!d)return alert('Заполни все поля.');local.homework.push({id:Date.now(),subject:s,text:t,date:d,done:false});saveLocal();close();render()}}
function openSubject(){modal(`<div class="modalHead"><h3>Добавить предмет</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Название предмета</label><input id="ns" placeholder="Математика"></div><button class="primary" id="saveS">Добавить предмет</button></div>`);document.getElementById('saveS').onclick=()=>{let s=document.getElementById('ns').value.trim();if(!s)return alert('Укажи предмет.');if(local.grades[s])return alert('Такой предмет уже есть.');local.grades[s]=[];local.targets[s]=4;saveLocal();close();render()}}
function openGrade(s){modal(`<div class="modalHead"><h3>Добавить оценку</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Предмет</label><select id="gs">${Object.keys(local.grades).map(x=>`<option ${x===s?'selected':''}>${e(x)}</option>`).join('')}</select></div><div class="field"><label>Оценка</label><select id="gv"><option>5</option><option>4</option><option>3</option><option>2</option></select></div><button class="primary" id="saveG">Добавить оценку</button></div>`);document.getElementById('saveG').onclick=()=>{local.grades[document.getElementById('gs').value].push(+document.getElementById('gv').value);saveLocal();close();render()}}
function chooseSchedule(){route='admin';render();setTimeout(()=>document.getElementById('adminPhoto')?.click(),50)}
async function readAdminPhoto(ev){const f=ev.target.files?.[0];if(!f)return;const box=document.getElementById('adminResult');box.innerHTML='<div class="notice">⏳ Отправляю фото в защищённую функцию и запускаю Gemini 3.6 Flash…</div>';try{const b64=(await b64file(f)).split(',')[1];const {data:{session:s}}=await sb.auth.getSession();const r=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({image:b64,mimeType:f.type||'image/jpeg'})});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка обработки фото');const entries=Object.entries(data.schedules||{}).map(([class_name,lessons])=>({class_name,lessons,updated_at:new Date().toISOString(),updated_by:session.user.id}));if(!entries.length)throw Error('Gemini не нашёл ни одного класса.');const {error}=await sb.from('schedules').upsert(entries,{onConflict:'class_name'});if(error)throw error;box.innerHTML=`<div class="notice ok">✓ Готово. В Supabase записано классов: <b>${entries.length}</b>. Теперь каждый ученик увидит расписание своего класса.</div>`;await loadSchedule();await adminStats();}catch(err){box.innerHTML='<div class="notice bad"><b>Не удалось обработать фото.</b><br>'+e(err.message||err)+'</div>'}}
async function adminStats(){const box=document.getElementById('adminStats');if(!box)return;const {data}=await sb.from('schedules').select('class_name,updated_at');if(!data)return;const latest=data.slice().sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0];box.innerHTML=`<div class="stat"><b>${data.length}</b><span>классов в расписании</span></div><div class="stat"><b>${latest?new Date(latest.updated_at).toLocaleDateString('ru-RU'):'—'}</b><span>последнее обновление</span></div>`}
function bind(){document.getElementById('hamb').onclick=()=>openMenu();document.getElementById('accountTop').onclick=()=>{route='account';render()};document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{route=x.dataset.r;render()});document.querySelectorAll('[data-r2]').forEach(x=>x.onclick=()=>{route=x.dataset.r2;render()});document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a,x.dataset));document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{local.settings[x.dataset.toggle]=!local.settings[x.dataset.toggle];saveLocal();render()});document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{local.settings.theme=x.dataset.theme;saveLocal();render()});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{local.settings.accent=x.dataset.color;saveLocal();render()});document.querySelectorAll('[data-target]').forEach(x=>x.onchange=()=>{local.targets[x.dataset.target]=+x.value;saveLocal();render()});const p=document.getElementById('adminPhoto');if(p)p.onchange=readAdminPhoto;if(route==='admin')adminStats()}
function openMenu(){const existing=document.getElementById('sideMenu');if(existing){existing.remove();return}const d=document.createElement('div');d.id='sideMenu';d.innerHTML=`<div style="position:fixed;inset:0;background:#0008;z-index:70" id="menuBg"><div class="menu" style="position:absolute;left:10px;top:72px;right:10px;max-width:360px"><button data-menu="home">⌂ Главная</button><button data-menu="homework">▤ Домашние задания</button><button data-menu="grades">▱ Оценки</button><button data-menu="account">👤 Аккаунт</button><button data-menu="settings">⚙ Настройки</button>${isAdmin()?'<button data-menu="admin">🛡 Админ-панель</button>':''}<button class="danger" data-menu="logout">🚪 Выйти</button></div></div>`;document.body.appendChild(d);document.getElementById('menuBg').onclick=x=>{if(x.target.id==='menuBg')d.remove()};d.querySelectorAll('[data-menu]').forEach(b=>b.onclick=async()=>{const r=b.dataset.menu;d.remove();if(r==='logout'){await sb.auth.signOut();session=null;profile=null;schedule=null;route='home';render();return}route=r;render()})}
async function act(a,d){if(a==='account'){route='account';render()}if(a==='addHw')openHw();if(a==='addSubject')openSubject();if(a==='addGrade')openGrade(d.s||'');if(a==='toggleHw'){let x=local.homework.find(x=>x.id==d.id);if(x){x.done=!x.done;saveLocal();render()}}if(a==='gm'){let m=document.getElementById('gm-'+sid(d.s));document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.hidden=true});m.hidden=!m.hidden}if(a==='delSubject'){if(confirm('Удалить предмет и все его оценки?')){delete local.grades[d.s];delete local.targets[d.s];saveLocal();render()}}if(a==='schedMenu'){const m=document.getElementById('schedMenu');m.hidden=!m.hidden}if(a==='scheduleReload'){await loadSchedule();render()}if(a==='saveAccount'){const username=document.getElementById('an').value.trim();const className=document.getElementById('ac2').value;if(username.length<2)return alert('Никнейм слишком короткий.');const newEmail=technicalEmail(username);const emailChange=await sb.auth.updateUser({email:newEmail});if(emailChange.error)return alert('Не удалось изменить ник/логин: '+emailChange.error.message);const {data,error}=await sb.from('profiles').update({username,class_name:className}).eq('id',session.user.id).select().single();if(error)return alert(error.message);profile=data;await loadSchedule();render()}if(a==='changePassword'){const p=document.getElementById('newpass').value;if(p.length<6)return alert('Пароль должен быть не короче 6 символов.');const {error}=await sb.auth.updateUser({password:p});if(error)return alert(error.message);alert('Пароль изменён.');document.getElementById('newpass').value=''}if(a==='logout'){await sb.auth.signOut();session=null;profile=null;schedule=null;render()}if(a==='adminReload'){await adminStats()}}
function b64file(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
sb.auth.onAuthStateChange(async(_event,s)=>{if(s){session=s;if(!profile)await bootUser(s)}else{session=null;profile=null;schedule=null;render()}});
(async()=>{apply();const {data}=await sb.auth.getSession();if(data.session){session=data.session;await bootUser(session)}else render()})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
